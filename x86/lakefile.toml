# x86-64 side: rustc's assembly for `avg`, verified with Kraken.
# Separate package because Kraken pins its own Lean nightly.
name = "AvgX86"
version = "0.1.0"
defaultTargets = ["AvgX86"]

[[require]]
name = "spec"
path = "../spec"

# avgFast and `avgFast_isAvg`: the machine code computes avgFast, and this lemma finishes.
[[require]]
name = "algo"
path = "../algo"

# Hand-written assembly semantics with a native differential-test harness.
[[require]]
name = "Kraken"
git = "https://github.com/AeneasVerif/kraken"
rev = "30f5a5f9f668283a294bf5ec5859e75b47b3a61a"

[[lean_lib]]
name = "AvgX86"
