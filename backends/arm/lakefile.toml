# AArch64 machine code for `avg`, verified with LNSym's Armv8 semantics.
name = "AvgArm"
version = "0.1.0"
defaultTargets = ["AvgArm"]

[[require]]
name = "spec"
path = "../../core/spec"

# avgFast and `avgFast_isAvg`: the machine code computes avgFast, and this lemma finishes.
[[require]]
name = "algo"
path = "../../core/algo"

# The adapter owns the canonical LNSym dependency and generic ELF export.
[[require]]
name = "AssemblyArm"
path = "../../tooling/arm"

[[lean_lib]]
name = "AvgArm"

[[lean_exe]]
name = "export"
root = "Export"
