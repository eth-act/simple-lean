# RISC-V side: `avg` as RV64IM machine code, proved to satisfy `IsAvg`.
name = "AvgRiscv"
version = "0.1.0"
defaultTargets = ["AvgRiscv"]

[[require]]
name = "spec"
path = "../../core/spec"

# avgFast and `avgFast_isAvg`: the machine code computes avgFast, and this lemma finishes.
[[require]]
name = "algo"
path = "../../core/algo"

# Generic checked assembly export and its pinned RISC-V model.
[[require]]
name = "AssemblyRiscv"
path = "../../tooling/riscv"

[[lean_lib]]
name = "AvgRiscv"

[[lean_exe]]
name = "export"
root = "Export"
