# x86-64 side: rustc's assembly for `avg`, verified with Kraken.
name = "AvgX86"
version = "0.1.0"
defaultTargets = ["AvgX86"]

[[require]]
name = "spec"
path = "../../core/spec"

# avgFast and `avgFast_isAvg`: the machine code computes avgFast, and this lemma finishes.
[[require]]
name = "algo"
path = "../../core/algo"

# Reusable Kraken-backed assembly/header export adapter.
[[require]]
name = "AssemblyX86"
path = "../../tooling/x86"

[[lean_lib]]
name = "AvgX86"

[[lean_exe]]
name = "export"
root = "Export"
