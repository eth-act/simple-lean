# Language-independent algorithms and their proofs against the shared specification.
# Core Lean only, compiled under each consumer's toolchain.
name = "algo"
version = "0.1.0"
defaultTargets = ["AvgAlgo"]
# `lake test` builds AvgAlgoTest (tool-behaviour checks such as #guard_msgs).
testDriver = "AvgAlgoTest"

[[require]]
name = "spec"
path = "../spec"

[[lean_lib]]
name = "AvgAlgo"

# Regression checks on tool output (e.g. bv_decide's counterexample); not part of the library.
[[lean_lib]]
name = "AvgAlgoTest"
