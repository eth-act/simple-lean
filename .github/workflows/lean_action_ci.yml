name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Aeneas/Charon release used to extract aeneas/AvgAeneas/Impl from rust/.
  # MUST match the `rev` of the `aeneas` requirement in aeneas/lakefile.toml
  # (release nightly-2026.09.25-fd27c97 == commit fd27c97d39108dd1c6b0cb46bbefd0b94a47b591).
  AENEAS_RELEASE: nightly-2026.09.25-fd27c97

jobs:
  lean:
    name: Aeneas proof (aeneas/, Lean v4.31 + Aeneas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs elan + the `lean-toolchain` toolchain, caches `.lake` keyed on
      # lean-toolchain + lake-manifest.json, fetches the Mathlib cache, runs `lake build`.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: aeneas
          # Mathlib is only a transitive dependency (via aeneas), so don't rely on auto-detection.
          use-mathlib-cache: true

  algo:
    name: avgFast / avgOverflow proofs + tests (algo/, core Lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `lake build` (AvgAlgo) then `lake test` (AvgAlgoTest, via `testDriver`).
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: algo
          use-mathlib-cache: false
          # Explicit, so a broken test driver fails CI instead of silently skipping tests.
          test: true

  riscv-lean:
    name: RISC-V proof (riscv/, Lean v4.33 + riscv-zkvm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Separate Lake package: riscv-zkvm pins Lean v4.33.0, Aeneas (aeneas/) v4.31.0.
      # riscv-zkvm is a tagged dependency, so Lake downloads its prebuilt oleans.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: riscv
          use-mathlib-cache: false

  riscv-asm:
    name: rustc RISC-V output matches the proved avgProgram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install RISC-V binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-riscv64-unknown-elf
      - name: Install the pinned rustc (RUST_TOOLCHAIN in scripts/check-riscv-asm.py)
        run: |
          TC=$(sed -n 's/^RUST_TOOLCHAIN = "\(.*\)"/\1/p' scripts/check-riscv-asm.py)
          rustup toolchain install "$TC" --profile minimal -t riscv64imac-unknown-none-elf
      - name: Compare disassembly of `avg` with riscv/AvgRiscv/Impl.lean
        run: scripts/check-riscv-asm.py

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: cargo test
        run: cargo +stable test

  extraction:
    name: Rust -> Lean extraction is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Aeneas release ${{ env.AENEAS_RELEASE }}
        run: |
          dir="$RUNNER_TEMP/aeneas"
          mkdir -p "$dir"
          curl -fsSL --retry 3 \
            "https://github.com/AeneasVerif/aeneas/releases/download/${AENEAS_RELEASE}/aeneas-linux-x86_64.tar.gz" \
            | tar -xz -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "AENEAS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install the Rust nightly Charon was built against
        run: |
          CH=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' "$AENEAS_DIR/rust-toolchain")
          if [ -z "$CH" ]; then
            echo "::error::Could not read the toolchain channel from $AENEAS_DIR/rust-toolchain"
            cat "$AENEAS_DIR/rust-toolchain"
            exit 1
          fi
          echo "Installing $CH"
          rustup toolchain install "$CH" --profile minimal -c rustc-dev -c llvm-tools -c rust-src

      - name: Extract Rust with Charon and Aeneas
        working-directory: rust
        run: |
          charon cargo --preset=aeneas
          aeneas -backend lean -dest ../aeneas/AvgAeneas/Impl -namespace Avg.Rust avg.llbc

      - name: Check generated Lean matches the committed aeneas/AvgAeneas/Impl
        run: |
          if ! git diff --exit-code -- aeneas/AvgAeneas/Impl || [ -n "$(git status --porcelain -- aeneas/AvgAeneas/Impl)" ]; then
            git status --porcelain -- aeneas/AvgAeneas/Impl
            echo "::error::aeneas/AvgAeneas/Impl is out of date with rust/. Regenerate it locally (in rust/, with the ${AENEAS_RELEASE} charon/aeneas binaries on PATH): 'charon cargo --preset=aeneas && aeneas -backend lean -dest ../aeneas/AvgAeneas/Impl -namespace Avg.Rust avg.llbc', then commit the result. Never hand-edit aeneas/AvgAeneas/Impl."
            exit 1
          fi
          echo "aeneas/AvgAeneas/Impl is in sync with rust/."
