name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Aeneas/Charon release used to extract backends/aeneas/AvgAeneas/Impl from impl/rust/.
  # MUST match the `rev` of the `aeneas` requirement in backends/aeneas/lakefile.toml.
  AENEAS_RELEASE: nightly-2026.09.25-fd27c97

jobs:
  lean:
    name: Aeneas proof (backends/aeneas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs elan + the `lean-toolchain` toolchain, caches `.lake` keyed on
      # lean-toolchain + lake-manifest.json, fetches the Mathlib cache, runs `lake build`.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: backends/aeneas
          # Mathlib is only a transitive dependency (via aeneas), so don't rely on auto-detection.
          use-mathlib-cache: true

  algo:
    name: avgFast / avgOverflow proofs + tests (core/algo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `lake build` (AvgAlgo) then `lake test` (AvgAlgoTest, via `testDriver`).
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: core/algo
          use-mathlib-cache: false
          # Explicit, so a broken test driver fails CI instead of silently skipping tests.
          test: true

  riscv-lean:
    name: RISC-V proof (backends/riscv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The backend selects its toolchain; tooling/riscv owns the model dependency.
      # riscv-zkvm is a tagged dependency, so Lake downloads its prebuilt oleans.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: backends/riscv
          use-mathlib-cache: false

  x86-lean:
    name: x86-64 proof (backends/x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # tooling/x86 owns the Kraken dependency; the backend owns the avg proof.
      # This builds our proof; it does not run Kraken's upstream native differential tests.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: backends/x86
          use-mathlib-cache: false

  arm-lean:
    name: AArch64 proof (backends/arm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: backends/arm
          use-mathlib-cache: false

  asm:
    name: rustc machine code matches each proved avgProgram (RISC-V, x86-64, AArch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install RISC-V binutils and LLVM (x86-64 objdump ships with the runner)
        run: sudo apt-get update && sudo apt-get install -y binutils-riscv64-unknown-elf llvm
      - name: Install the pinned rustc (RUST_TOOLCHAIN in scripts/check-asm.py)
        run: |
          TC=$(sed -n 's/^RUST_TOOLCHAIN = "\(.*\)"/\1/p' scripts/check-asm.py)
          rustup toolchain install "$TC" --profile minimal \
            -t riscv64imac-unknown-none-elf -t x86_64-unknown-linux-gnu -t aarch64-unknown-linux-gnu
      - name: Compare disassembly of `avg` with each ISA's Impl.lean
        run: scripts/check-asm.py

  assembly-export:
    name: Lean assembly export (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - backend: x86
            package: backends/x86
            target: x86_64-linux-gnu
            symbol: avg
          - backend: arm
            package: backends/arm
            target: aarch64-linux-gnu
            symbol: avg
          - backend: riscv
            package: backends/riscv
            target: riscv64-linux-gnu
            symbol: avg
          - backend: identity
            package: examples/identity
            target: x86_64-linux-gnu
            symbol: identity_u64
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ matrix.package }}
          use-mathlib-cache: false
      - name: Export proved assembly and header without Rust
        run: python3 scripts/export.py --package "${{ matrix.package }}" --export Export --out-dir "dist/${{ matrix.backend }}"
      - name: Install assembler for smoke testing
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Assemble for the target without publishing binaries
        env:
          TARGET: ${{ matrix.target }}
          SOURCE: dist/${{ matrix.backend }}/${{ matrix.symbol }}.s
        run: |
          flags=()
          if [ "$TARGET" = riscv64-linux-gnu ]; then
            flags=(-march=rv64imafd -mabi=lp64d -mno-relax)
          fi
          clang --target="$TARGET" "${flags[@]}" -c "$SOURCE" -o "$RUNNER_TEMP/function.o"
      - name: Exercise native assembly through Python FFI and C
        if: matrix.backend == 'x86'
        run: python3 scripts/check-avg.py dist/x86
      - name: Exercise independent one-argument example
        if: matrix.backend == 'identity'
        run: python3 scripts/check-identity.py dist/identity
      - uses: actions/upload-artifact@v4
        with:
          name: assembly-${{ matrix.backend }}
          path: |
            dist/**/*.s
            dist/**/*.h
          if-no-files-found: error

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/rust
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: cargo test
        run: cargo +stable test

  extraction:
    name: Rust -> Lean extraction is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Aeneas release ${{ env.AENEAS_RELEASE }}
        run: |
          dir="$RUNNER_TEMP/aeneas"
          mkdir -p "$dir"
          curl -fsSL --retry 3 \
            "https://github.com/AeneasVerif/aeneas/releases/download/${AENEAS_RELEASE}/aeneas-linux-x86_64.tar.gz" \
            | tar -xz -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "AENEAS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install the Rust nightly Charon was built against
        run: |
          CH=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' "$AENEAS_DIR/rust-toolchain")
          if [ -z "$CH" ]; then
            echo "::error::Could not read the toolchain channel from $AENEAS_DIR/rust-toolchain"
            cat "$AENEAS_DIR/rust-toolchain"
            exit 1
          fi
          echo "Installing $CH"
          rustup toolchain install "$CH" --profile minimal -c rustc-dev -c llvm-tools -c rust-src

      - name: Extract Rust with Charon and Aeneas
        working-directory: impl/rust
        run: |
          charon cargo --preset=aeneas
          aeneas -backend lean -dest ../../backends/aeneas/AvgAeneas/Impl -namespace Avg.Rust avg.llbc

      - name: Check generated Lean matches the committed backends/aeneas/AvgAeneas/Impl
        run: |
          if ! git diff --exit-code -- backends/aeneas/AvgAeneas/Impl || [ -n "$(git status --porcelain -- backends/aeneas/AvgAeneas/Impl)" ]; then
            git status --porcelain -- backends/aeneas/AvgAeneas/Impl
            echo "::error::backends/aeneas/AvgAeneas/Impl is out of date with impl/rust/. Regenerate it locally (in impl/rust/, with the ${AENEAS_RELEASE} charon/aeneas binaries on PATH): 'charon cargo --preset=aeneas && aeneas -backend lean -dest ../../backends/aeneas/AvgAeneas/Impl -namespace Avg.Rust avg.llbc', then commit the result. Never hand-edit backends/aeneas/AvgAeneas/Impl."
            exit 1
          fi
          echo "backends/aeneas/AvgAeneas/Impl is in sync with impl/rust/."
