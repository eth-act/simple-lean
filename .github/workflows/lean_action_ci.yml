name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Aeneas/Charon release used to extract Avg/Impl/Rust from rust/.
  # MUST match the `rev` of the `aeneas` requirement in lakefile.toml
  # (release nightly-2026.09.25-fd27c97 == commit fd27c97d39108dd1c6b0cb46bbefd0b94a47b591).
  AENEAS_RELEASE: nightly-2026.09.25-fd27c97

jobs:
  lean:
    name: Lean build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs elan + the `lean-toolchain` toolchain, caches `.lake` keyed on
      # lean-toolchain + lake-manifest.json, fetches the Mathlib cache, runs
      # `lake build` (library) then `lake test` (AvgTest, via `testDriver`).
      - uses: leanprover/lean-action@v1
        with:
          # Mathlib is only a transitive dependency (via aeneas), so don't rely on auto-detection.
          use-mathlib-cache: true
          # Explicit, so a broken test driver fails CI instead of silently skipping tests.
          test: true

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: cargo test
        run: cargo +stable test

  extraction:
    name: Rust -> Lean extraction is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Aeneas release ${{ env.AENEAS_RELEASE }}
        run: |
          dir="$RUNNER_TEMP/aeneas"
          mkdir -p "$dir"
          curl -fsSL --retry 3 \
            "https://github.com/AeneasVerif/aeneas/releases/download/${AENEAS_RELEASE}/aeneas-linux-x86_64.tar.gz" \
            | tar -xz -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "AENEAS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install the Rust nightly Charon was built against
        run: |
          CH=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' "$AENEAS_DIR/rust-toolchain")
          if [ -z "$CH" ]; then
            echo "::error::Could not read the toolchain channel from $AENEAS_DIR/rust-toolchain"
            cat "$AENEAS_DIR/rust-toolchain"
            exit 1
          fi
          echo "Installing $CH"
          rustup toolchain install "$CH" --profile minimal -c rustc-dev -c llvm-tools -c rust-src

      - name: Extract Rust with Charon and Aeneas
        working-directory: rust
        run: |
          charon cargo --preset=aeneas
          aeneas -backend lean -dest ../Avg/Impl/Rust -namespace Avg.Rust avg.llbc

      - name: Check generated Lean matches the committed Avg/Impl/Rust
        run: |
          if ! git diff --exit-code -- Avg/Impl/Rust || [ -n "$(git status --porcelain -- Avg/Impl/Rust)" ]; then
            git status --porcelain -- Avg/Impl/Rust
            echo "::error::Avg/Impl/Rust is out of date with rust/. Regenerate it locally (in rust/, with the ${AENEAS_RELEASE} charon/aeneas binaries on PATH): 'charon cargo --preset=aeneas && aeneas -backend lean -dest ../Avg/Impl/Rust -namespace Avg.Rust avg.llbc', then commit the result. Never hand-edit Avg/Impl/Rust."
            exit 1
          fi
          echo "Avg/Impl/Rust is in sync with rust/."
