name = "Avg"
version = "0.1.0"
defaultTargets = ["Avg"]
# `lake test` builds the AvgTest library (tool-behaviour checks such as #guard_msgs).
testDriver = "AvgTest"

# Must match the aeneas binary used to generate Avg/Impl/Rust (nightly-2026.09.25-fd27c97).
[[require]]
name = "aeneas"
git = { url = "https://github.com/AeneasVerif/aeneas", subDir = "backends/lean" }
rev = "fd27c97d39108dd1c6b0cb46bbefd0b94a47b591"

[[lean_lib]]
name = "Avg"

# Regression checks on tool output (e.g. bv_decide's counterexample); not part of the trusted library.
[[lean_lib]]
name = "AvgTest"
