# The algorithm, independent of language: avgWide (widening), avgFast (the bit trick), avgOverflow
# (the overflowing one), and their proofs against the spec. Core Lean only, like spec/, so both proof packages
# (aeneas/: Lean v4.31, riscv/: Lean v4.33) can depend on it under their own toolchains.
name = "algo"
version = "0.1.0"
defaultTargets = ["AvgAlgo"]
# `lake test` builds AvgAlgoTest (tool-behaviour checks such as #guard_msgs).
testDriver = "AvgAlgoTest"

[[require]]
name = "spec"
path = "../spec"

[[lean_lib]]
name = "AvgAlgo"

# Regression checks on tool output (e.g. bv_decide's counterexample); not part of the library.
[[lean_lib]]
name = "AvgAlgoTest"
